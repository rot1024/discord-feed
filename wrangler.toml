name = "discord-feed"
main = "src/index.ts"
compatibility_date = "2025-01-06"
workers_dev = true

# Disable preview URLs
preview_urls = false

# Enable observability (logging)
[observability]
enabled = true

# KV Namespace binding
[[kv_namespaces]]
binding = "KV"
id = "7bc872dc9d534c829d5efa3c2f633b5f"

# Cron Trigger - every 15 minutes
[triggers]
crons = ["*/15 * * * *"]
